version: '3.8'

services:
  simple-java-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simple-java-app
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=docker
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    volumes:
      - ./src:/app/src
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
